<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Snobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="estilos.css">
</head>

<body>
    <div class="contenedor">
        <div class="menu">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a href="#" class="icono"><ion-icon name="videocam-outline"></ion-icon></a>
                    <a class="navbar-brand me-auto" href="#">Snob Series</a>

                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                        aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <a href="#" class="icono"><ion-icon name="videocam-outline"></ion-icon></a>
                            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Snob Series</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                                aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body">
                            <ul class="navbar-nav justify-content-center flex-grow-1 pe-3 menu-items">
                                <li class="nav-item"><a class="nav-link mx-lg-2 active" aria-current="page"
                                        href="#">Series</a></li>
                                <li class="nav-item"><a class="nav-link mx-lg-2" href="#">Premios y Eventos</a></li>
                                <li class="nav-item"><a class="nav-link mx-lg-2" href="#">Celebridades</a></li>
                            </ul>
                            <form class="d-flex me-5 buscador" role="search">
                                <label>
                                    <input class="form-control me-2" type="search" placeholder="Buscador"
                                        aria-label="Search" />
                                </label>
                            </form>
                        </div>
                    </div>

                    <li class="nav-item dropdown me-4 profile">
                        <a class="nav-link2 dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">Perfil</a>
                        <ul class="dropdown-menu dropdown-menu-end mini-dropdown">
                            <li><a class="dropdown-item" href="#">Listas</a></li>
                            <li><a class="dropdown-item" href="#">Reseñas</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Taller</a></li>
                        </ul>
                    </li>

                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler"><ion-icon name="grid-outline"></ion-icon></span>
                    </button>
                </div>
            </nav>
        </div>

        <div class="titulo">
            <h1>Información Series</h1>
        </div>

        <div class="buscar">
            <form class="d-flex me-5 buscador" role="search">
                <label>
                    <input class="form-control me-2" type="search" placeholder="Buscador" aria-label="Search" />
                </label>
            </form>
            <li class="nav-item dropdown me-4 filtro">
                <a class="nav-link2 dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">Filtrar</a>
                <ul class="dropdown-menu dropdown-menu-end mini-dropdown">
                    <li><a class="dropdown-item" href="#">Alfabeto</a></li>
                    <li><a class="dropdown-item" href="#">Fecha Creación</a></li>
                </ul>
            </li>
        </div>

        <div class="editar">
            <button><ion-icon name="pencil-outline"></ion-icon>Editar</button>
        </div>

        <div class="tabla">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Channel</th>
                        <th>Seassons</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Las filas se insertarán dinámicamente aquí -->
                </tbody>
            </table>
        </div>

        <div class="cartas">
            <div id="carouselExample" class="carousel">
                <div class="carousel-inner carousel2-inner" id="carousel-container">
                    <!-- Las cards se insertarán aquí-->
                </div>
                <button class="carousel-control-prev carousel2-control-prev" type="button"
                    data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next carousel2-control-next" type="button"
                    data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="module" src="./dist/main.js"></script>
    <script>
        const multipleItemCarousel = document.querySelector("#carouselExample");

        if (window.matchMedia("(min-width:576px)").matches) {
            const carousel = new bootstrap.Carousel(multipleItemCarousel, {
                interval: false
            });

            var carouselWidth = $(".carousel2-inner")[0].scrollWidth;
            var cardWidth = $(".carousel2-item").width();

            var scrollPosition = 0;

            $(".carousel2-control-next").on("click", function () {
                if (scrollPosition < carouselWidth - cardWidth * 4) {
                    scrollPosition = scrollPosition + cardWidth;
                    $(".carousel2-inner").animate({ scrollLeft: scrollPosition }, 600);
                }
            });
            $(".carousel2-control-prev").on("click", function () {
                if (scrollPosition > 0) {
                    scrollPosition = scrollPosition - cardWidth;
                    $(".carousel2-inner").animate({ scrollLeft: scrollPosition }, 600);
                }
            });
        } else {
            $(multipleItemCarousel).addClass("slide");
        }
    </script>
</body>
</html>
